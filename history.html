<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SmartHome History</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<h2>Presiune [hPa]</h2>
<canvas id="presChart"></canvas>

<h2>Temperatura [C]</h2>
<canvas id="tempChart"></canvas>

<h2>Umiditate [%]</h2>
<canvas id="humChart"></canvas>

<script>

const API_KEY = "J1W7SJONHU0G46GS";
const CHANNEL_ID = "3447801";

async function getData() {

    let allFeeds = [];

    // Luăm 8 blocuri de câte 100
    // și folosim offset pentru a evita cache-ul >100

    for (let offset = 0; offset < 800; offset += 100) {

        const url =
            https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json +
            ?api_key=${API_KEY} +
            &results=100 +
            &offset=${offset} +
            &_=${Date.now()};

        console.log("Cer:", offset);

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("ThingSpeak HTTP error: " + response.status);
        }

        const data = await response.json();

        console.log(
            "Offset:",
            offset,
            "Entry-uri:",
            data.feeds ? data.feeds.length : 0
        );

        if (data.feeds) {
            allFeeds.push(...data.feeds);
        }

        if (!data.feeds || data.feeds.length < 100) {
            break;
        }
    }

    // Eliminăm duplicatele
    const unique = [];
    const ids = new Set();

    allFeeds.forEach(item => {

        if (!ids.has(item.entry_id)) {
            ids.add(item.entry_id);
            unique.push(item);
        }

    });

    // Sortare după entry_id
    unique.sort((a, b) => a.entry_id - b.entry_id);

    // Ultimele 720
    return unique.slice(-720);
}


getData()
.then(feeds => {

    console.log("TOTAL:", feeds.length);

    if (feeds.length === 0) {
        console.error("NU S-AU PRIMIT DATE!");
        return;
    }

    console.log("PRIMUL:", feeds[0]);
    console.log("ULTIMUL:", feeds[feeds.length - 1]);

    const labels = [];
    const temps = [];
    const hums = [];
    const press = [];

    feeds.forEach(item => {

        labels.push(
            new Date(item.created_at).toLocaleTimeString()
        );

        temps.push(parseFloat(item.field1));
        hums.push(parseFloat(item.field2));
        press.push(parseFloat(item.field3));

    });


    // TEMPERATURA

    new Chart(
        document.getElementById('tempChart'),
        {
            type: 'line',

            data: {
                labels: labels,

                datasets: [{
                    label: 'Temperatura',
                    data: temps
                }]
            }
        }
    );


    // UMIDITATE

    new Chart(
        document.getElementById('humChart'),
        {
            type: 'line',

            data: {
                labels: labels,

                datasets: [{
                    label: 'Umiditate',
                    data: hums
                }]
            }
        }
    );


    // PRESIUNE

    new Chart(
        document.getElementById('presChart'),
        {
            type: 'line',

            data: {
                labels: labels,

                datasets: [{
                    label: 'Presiune',
                    data: press
                }]
            }
        }
    );

})
.catch(error => {

    console.error("EROARE:", error);

});

</script>

</body>
</html>
