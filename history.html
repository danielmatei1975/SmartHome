<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SmartHome History-try1</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<h2>Presiune [hPa]</h2>
<canvas id="presChart"></canvas>

<h2>Temperatura [C]</h2>
<canvas id="tempChart"></canvas>

<h2>Umiditate [%]</h2>
<canvas id="humChart"></canvas>


<script>

const API_KEY = "J1W7SJONHU0G46GS";
const CHANNEL_ID = "3447801";


// --------------------------------------------------
// Cerem 720 + ultimele 100
// --------------------------------------------------

Promise.all([

    fetch(
        https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json +
        ?api_key=${API_KEY}&results=720
    ).then(response => response.json()),

    fetch(
        https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json +
        ?api_key=${API_KEY}&results=100&_=${Date.now()}
    ).then(response => response.json())

])

.then(([history, latest]) => {

    console.log("Istoric:", history.feeds.length);
    console.log("Ultimele:", latest.feeds.length);


    // --------------------------------------------------
    // Combinăm datele
    // --------------------------------------------------

    const map = new Map();


    // Istoricul de 720
    history.feeds.forEach(item => {
        map.set(item.entry_id, item);
    });


    // Ultimele 100 au prioritate
    // deoarece acestea nu sunt cache-uite
    latest.feeds.forEach(item => {
        map.set(item.entry_id, item);
    });


    // Transformăm Map în array
    let feeds = Array.from(map.values());


    // Sortare cronologică
    feeds.sort((a, b) => a.entry_id - b.entry_id);


    // Păstrăm ultimele 720
    feeds = feeds.slice(-720);


    console.log("TOTAL FINAL:", feeds.length);
    console.log("ULTIMUL ENTRY:", feeds[feeds.length - 1]);


    // --------------------------------------------------
    // Pregătim datele pentru grafice
    // --------------------------------------------------

    const labels = [];
    const temps = [];
    const hums = [];
    const press = [];


    feeds.forEach(item => {

        labels.push(
            new Date(item.created_at).toLocaleTimeString()
        );

        temps.push(parseFloat(item.field1));
        hums.push(parseFloat(item.field2));
        press.push(parseFloat(item.field3));

    });


    // --------------------------------------------------
    // TEMPERATURA
    // --------------------------------------------------

    new Chart(
        document.getElementById('tempChart'),
        {
            type: 'line',

            data: {
                labels: labels,

                datasets: [{
                    label: 'Temperatura',
                    data: temps
                }]
            }
        }
    );


    // --------------------------------------------------
    // UMIDITATE
    // --------------------------------------------------

    new Chart(
        document.getElementById('humChart'),
        {
            type: 'line',

            data: {
                labels: labels,

                datasets: [{
                    label: 'Umiditate',
                    data: hums
                }]
            }
        }
    );


    // --------------------------------------------------
    // PRESIUNE
    // --------------------------------------------------

    new Chart(
        document.getElementById('presChart'),
        {
            type: 'line',

            data: {
                labels: labels,

                datasets: [{
                    label: 'Presiune',
                    data: press
                }]
            }
        }
    );

})


.catch(error => {

    console.error("EROARE THINGSPEAK:", error);

});

</script>

</body>
</html>
