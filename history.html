<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SmartHome History-try2</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

.chart-title {
    font-size: 24px;
    font-weight: bold;
    margin-top: 20px;
    margin-bottom: 10px;
}

.last-value {
    color: #2196F3;
    font-size: 28px;
    font-weight: bold;
    margin-left: 15px;
}

</style>

</head>

<body>

<h2 class="chart-title">
    Presiune [hPa]
    <span id="lastPress" class="last-value"></span>
</h2>

<canvas id="presChart"></canvas>


<h2 class="chart-title">
    Temperatura [C]
    <span id="lastTemp" class="last-value"></span>
</h2>

<canvas id="tempChart"></canvas>


<h2 class="chart-title">
    Umiditate [%]
    <span id="lastHum" class="last-value"></span>
</h2>

<canvas id="humChart"></canvas>


<script>

const API_KEY = "J1W7SJONHU0G46GS";
const CHANNEL_ID = "3447801";


async function loadFeeds() {

    const url =
        "https://api.thingspeak.com/channels/" +
        CHANNEL_ID +
        "/feeds.json?api_key=" +
        API_KEY +
        "&results=100&_=" + Date.now();

    console.log(url);

    const response = await fetch(url);

    if (!response.ok) {
        throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    if (!data.feeds || data.feeds.length === 0) {
        return [];
    }

    console.log("Am primit:", data.feeds.length, "entry-uri");

    // Sortare cronologica dupa data si ora
    data.feeds.sort((a, b) =>
        new Date(a.created_at) - new Date(b.created_at)
    );

    console.log(
        "PRIMUL:",
        data.feeds[0].entry_id,
        data.feeds[0].created_at
    );

    console.log(
        "ULTIMUL:",
        data.feeds[data.feeds.length - 1].entry_id,
        data.feeds[data.feeds.length - 1].created_at
    );

    return data.feeds;
}


loadFeeds()

.then(feeds => {

    if (feeds.length === 0) {
        console.error("Nu exista date!");
        return;
    }


    const labels = [];
    const temps = [];
    const hums = [];
    const press = [];


    feeds.forEach(item => {

        labels.push(
            new Date(item.created_at).toLocaleTimeString()
        );

        temps.push(parseFloat(item.field1));

        hums.push(parseFloat(item.field2));

        press.push(parseFloat(item.field3));

    });


    // =====================================================
    // ULTIMELE VALORI
    // =====================================================

    const lastTemp = temps[temps.length - 1];

    const lastHum = hums[hums.length - 1];

    const lastPress = press[press.length - 1];


    document.getElementById("lastTemp").textContent =
        lastTemp.toFixed(1) + " °C";


    document.getElementById("lastHum").textContent =
        lastHum.toFixed(1) + " %";


    document.getElementById("lastPress").textContent =
        lastPress.toFixed(1) + " hPa";


    // =====================================================
    // TEMPERATURA
    // =====================================================

    new Chart(
        document.getElementById("tempChart"),
        {
            type: "line",

            data: {
                labels: labels,

                datasets: [{
                    label: "Temperatura",
                    data: temps
                }]
            },

            options: {

                scales: {

                    x: {
                        ticks: {
                            maxTicksLimit: 8,

                            font: {
                                size: 14,
                                weight: 'bold'
                            }
                        }
                    },

                    y: {
                        ticks: {
                            maxTicksLimit: 6,

                            font: {
                                size: 14,
                                weight: 'bold'
                            }
                        }
                    }

                }

            }
        }
    );


    // =====================================================
    // UMIDITATE
    // =====================================================

    new Chart(
        document.getElementById("humChart"),
        {
            type: "line",

            data: {
                labels: labels,

                datasets: [{
                    label: "Umiditate",
                    data: hums
                }]
            },

            options: {

                scales: {

                    x: {
                        ticks: {
                            maxTicksLimit: 8,

                            font: {
                                size: 14,
                                weight: 'bold'
                            }
                        }
                    },

                    y: {
                        ticks: {
                            maxTicksLimit: 6,

                            font: {
                                size: 14,
                                weight: 'bold'
                            }
                        }
                    }

                }

            }
        }
    );


    // =====================================================
    // PRESIUNE
    // =====================================================

    new Chart(
        document.getElementById("presChart"),
        {
            type: "line",

            data: {
                labels: labels,

                datasets: [{
                    label: "Presiune",
                    data: press
                }]
            },

            options: {

                scales: {

                    x: {
                        ticks: {
                            maxTicksLimit: 8,

                            font: {
                                size: 14,
                                weight: 'bold'
                            }
                        }
                    },

                    y: {
                        ticks: {
                            maxTicksLimit: 6,

                            font: {
                                size: 14,
                                weight: 'bold'
                            }
                        }
                    }

                }

            }
        }
    );

})


.catch(error => {

    console.error("EROARE:", error);

});

</script>

</body>
</html>
