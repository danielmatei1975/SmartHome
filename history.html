<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SmartHome History</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<h2>Presiune [hPa]</h2>
<canvas id="presChart"></canvas>

<h2>Temperatura [C]</h2>
<canvas id="tempChart"></canvas>

<h2>Umiditate [%]</h2>
<canvas id="humChart"></canvas>

<script>

const API_KEY = "J1W7SJONHU0G46GS";
const CHANNEL_ID = "3447801";

async function getData() {

    let allFeeds = [];
    let endTime = null;

    while (allFeeds.length < 720) {

        let url =
            https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json +
            ?api_key=${API_KEY} +
            &results=100 +
            &_=${Date.now()};

        if (endTime !== null) {
            url += &end=${encodeURIComponent(endTime)};
        }

        const response = await fetch(url);
        const data = await response.json();

        console.log("Request:", url);
        console.log("Primit:", data.feeds ? data.feeds.length : 0);

        if (!data.feeds || data.feeds.length === 0) {
            break;
        }

        // Adaugă datele
        allFeeds.push(...data.feeds);

        // Cel mai vechi entry primit
        const oldest = data.feeds[0];

        // Cu o secundă înainte de cel mai vechi
        const oldDate = new Date(oldest.created_at);
        oldDate.setSeconds(oldDate.getSeconds() - 1);

        endTime = oldDate.toISOString();

        // Dacă am ajuns la 720
        if (allFeeds.length >= 720) {
            break;
        }

        // Dacă au venit mai puțin de 100, nu mai există suficiente date
        if (data.feeds.length < 100) {
            break;
        }
    }

    // Eliminăm eventualele duplicate după entry_id
    const unique = [];

    const ids = new Set();

    allFeeds.forEach(item => {

        if (!ids.has(item.entry_id)) {
            ids.add(item.entry_id);
            unique.push(item);
        }

    });

    // Sortare cronologică
    unique.sort((a, b) => a.entry_id - b.entry_id);

    // Ultimele 720
    return unique.slice(-720);
}


getData().then(feeds => {

    console.log("TOTAL ENTRY-URI:", feeds.length);

    if (feeds.length === 0) {
        console.error("Nu au fost primite date de la ThingSpeak.");
        return;
    }

    console.log("PRIMUL:", feeds[0]);
    console.log("ULTIMUL:", feeds[feeds.length - 1]);

    const labels = [];
    const temps = [];
    const hums = [];
    const press = [];

    feeds.forEach(item => {

        labels.push(
            new Date(item.created_at).toLocaleTimeString()
        );

        temps.push(parseFloat(item.field1));
        hums.push(parseFloat(item.field2));
        press.push(parseFloat(item.field3));

    });


    new Chart(
        document.getElementById('tempChart'),
        {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Temperatura',
                    data: temps
                }]
            }
        }
    );


    new Chart(
        document.getElementById('humChart'),
        {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Umiditate',
                    data: hums
                }]
            }
        }
    );


    new Chart(
        document.getElementById('presChart'),
        {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Presiune',
                    data: press
                }]
            }
        }
    );

});

</script>

</body>
</html>
