<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SmartHome History</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h2>Temperatura</h2>
<canvas id="tempChart"></canvas>

<h2>Umiditate</h2>
<canvas id="humChart"></canvas>

<h2>Presiune</h2>
<canvas id="presChart"></canvas>

<script>

fetch("https://api.thingspeak.com/channels/3447801/feeds.json?api_key=J1W7SJONHU0G46GS&results=48")
.then(response => response.json())
.then(data => {

    const labels = [];
    const temps = [];
    const hums = [];
    const press = [];

    data.feeds.forEach(item => {
        labels.push(
            new Date(item.created_at).toLocaleTimeString()
        );

        temps.push(parseFloat(item.field1));
        hums.push(parseFloat(item.field2));
        press.push(parseFloat(item.field3));
    });

    new Chart(
        document.getElementById('tempChart'),
        {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Temperatura',
                    data: temps
                }]
            }
        }
    );

    new Chart(
        document.getElementById('humChart'),
        {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Umiditate',
                    data: hums
                }]
            }
        }
    );

    new Chart(
        document.getElementById('presChart'),
        {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Presiune',
                    data: press
                }]
            }
        }
    );

});

</script>

</body>
</html>
